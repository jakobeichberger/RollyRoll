---
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  grpc_server_max_recv_msg_size: 33554432
  grpc_server_max_send_msg_size: 33554432

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  # Aufbewahrung der Protokolle – in .env ueber LOG_AUFBEWAHRUNG steuerbar,
  # bootstrap.sh traegt den Wert hier ein.
  retention_period: 90d
  allow_structured_metadata: true
  volume_enabled: true
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 24MB
  max_global_streams_per_user: 20000
  max_entries_limit_per_query: 20000
  max_query_series: 2000
  max_query_lookback: 0s
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Windows-Clients koennen nach einem Ausfall groessere Nachzuegler schicken
  max_line_size: 256kb
  max_line_size_truncate: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true
  evaluation_interval: 1m
  poll_interval: 1m
  ring:
    kvstore:
      store: inmemory

query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256

analytics:
  reporting_enabled: false

frontend:
  max_outstanding_per_tenant: 4096
  log_queries_longer_than: 20s
